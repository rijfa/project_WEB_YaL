<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Neural Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0e17; /* Глубокий темный фон */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow-color: #3498db; /* Основной синий неон */
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Добавим легкий градиент на фон */
            background: radial-gradient(circle at center, #1a253a 0%, #0a0e17 100%);
        }

        .login-container-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px); /* Эффект сильного размытия */
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: containerAppear 0.6s ease-out;
        }

        @keyframes containerAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .brand-logo span { color: var(--glow-color); }

        .title-login {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .flash-messages { margin-bottom: 20px; list-style: none; font-size: 0.9rem; }
        .flash-danger { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.2); }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-custom {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-custom:focus {
            outline: none;
            border-color: var(--glow-color);
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .btn-login:active { transform: translateY(1px); }

        .footer-links { margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
        .footer-links a {
            color: var(--glow-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .footer-links a:hover { color: #5dade2; }

    </style>
</head>
<body>

    <div class="login-container-glass">
        <div class="brand-logo">Neural<span>Visualizer</span></div>
        <h1 class="title-login">Добро пожаловать</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flash-messages">
            {% for category, message in messages %}
              <li class="flash-{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="input-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" class="input-custom" placeholder="Введите ваш логин" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="input-custom" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Войти в систему</button>
        </form>

        <div class="footer-links">
            Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
        </div>
    </div>

</body>
</html>
